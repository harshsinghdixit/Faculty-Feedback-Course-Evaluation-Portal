<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <nav><a href="index.html" class="nav-btn">Back to Portal</a></nav>
    </header>

    <main class="fade-in admin-grid">
        <section class="stats-card">
            <h2>Average Faculty Ratings</h2>
            <div id="ratingsSummary" class="summary-flex">
            </div>
        </section>

        <section class="table-container">
            <h2>Recent Submissions</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Student Details</th>
                        <th>Course/Faculty</th>
                        <th>Rating</th>
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
